<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlueWave Water Park | Book Tickets Online</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Google Fonts: Caveat (script headlines), Poppins (headings), Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Inline script to prevent theme flash before React loads -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('bluewave_theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-sand-50 dark:bg-[#0B1220] text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-aqua-200 selection:text-ocean-900 min-h-screen flex flex-col transition-colors duration-300">
    <div id="root" class="flex-grow flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
